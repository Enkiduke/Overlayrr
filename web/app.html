<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlayrr</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235b9cff'/%3E%3Crect x='9' y='6' width='14' height='20' rx='2' fill='none' stroke='%230b0d11' stroke-width='2.5'/%3E%3Cpath d='M9 19h14' stroke='%230b0d11' stroke-width='2.5'/%3E%3C/svg%3E"><style>%STYLE%
%APP_CSS%</style>
<header>
  <h1>Overlayrr</h1>
  <div class="seg views" id="views" role="tablist" aria-label="View"><button role="tab" data-view="titles">Titles</button><button role="tab" data-view="template">Template</button><button role="tab" data-view="collections">Collections</button><button role="tab" data-view="events">Events</button></div>
  <input id="q" type="search" placeholder="Search titles   /" aria-label="Search titles" title="Press / to search">
  <div class="chips" id="chips" role="group" aria-label="Show"></div>
  <div class="right">
    <span class="pill" id="up" tabindex="0"></span>
    <button id="push" class="primary" disabled>Nothing to push</button>
    <button id="out" class="quiet">Sign out</button>
  </div>
</header>
<button id="logbtn" aria-controls="log" aria-expanded="false">Console</button>
<main>
  <div id="browse">
  <div class="hint" id="hint" hidden><span>Open a title and click a poster or logo to try it. Each pick is saved right away and marked <b data-w="pending">Not pushed</b>;
    <b data-w="verb">Push</b> then makes the new posters<span data-w="send"> and sends them to Plex</span>. <b>Discard changes</b> on a title goes back to the last <span data-w="last">push</span>.</span><button id="hintx">Got it</button></div>
  <div class="hint" id="empty" hidden><span id="emptytext"></span><button id="clearq" hidden>Clear search</button></div>
  <div id="grid"></div><div class="more dim center" id="more" hidden>Loading more…</div>
  </div>
  <section id="collections" aria-label="Collection manager" hidden></section>
  <section id="tpl" aria-label="Template" hidden></section>
  <section id="events" aria-label="Event manager" hidden></section>
</main>
<div id="veil" hidden></div><aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" tabindex="-1" hidden></aside>
<section id="log" aria-label="Console" hidden><div><b id="jobname">Console</b><button id="logx">Close</button></div><pre></pre></section>
<div id="lb" role="dialog" aria-modal="true" aria-label="Image viewer" hidden></div>
<div id="addbox" role="dialog" aria-modal="true" aria-labelledby="addtitle" hidden></div>
<div id="crop" role="dialog" aria-modal="true" aria-label="Crop a poster" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
%VENDOR_JS%</script>
<script>
%TEMPLATE_JS%</script>
<script>
%APP_JS%</script></html>
