# Copy to config.yaml. Paths are relative to this YAML file.
# Credentials are read directly from .env next to this YAML file.
# Shell environment variables take precedence over .env.
plex:
  url: http://localhost:32400
  libraries: [Movies, TV Shows]  # Library names or numeric IDs
  upload: false                 # true saves AND sends the rendered posters to Plex
  include_seasons: true          # Generate season posters for scanned TV shows
  include_episodes: false        # Episode title cards for scanned TV shows (needs episode_options in the layout)
  include_collections: false     # Posters for movie collections in the scanned movie libraries; see README
  sync_collections: false        # Each run first makes/updates franchise collections (needs upload: true to change Plex; otherwise only a plan is printed)
  collection_min_items: 2        # A franchise needs at least this many of your movies in a library
  collection_sync: sync          # sync: add and remove members to match TMDb; append: only add
  collection_streaming: "off"    # TV "<Service> Shows" collections: off, originals (shows that aired on the service) or available (streaming there now)
  collection_region: US          # Country for collection_streaming: available
  recent_collections: false      # Create "Newly Released" (movies) and "New Episodes" (TV) if missing, and keep their windows below
  recent_movie_days: 90          # Newly Released: movies released in the last this-many days
  recent_episode_days: 7         # New Episodes: episodes aired in the last this-many days
  upload_logo: true              # With upload: also upload each movie's/series' logo as its Plex clear logo and select it
  completion_label: Overlayrr    # Added after upload (--added skips titles that have it); stock fallback uses "Overlayrr: Stock"
  # data_dir: /var/lib/plexmediaserver/Library/Application Support/Plex Media Server  # Only for --cleanup; see README
  # cleanup_min_age_minutes: 60  # --cleanup leaves files newer than this alone
                                # Set to "" to disable server labels

assets_dir: assets             # Sources and rendered.jpg together in each media folder
cache_dir: .cache
workers: 2
quality: 95
language: en
missing_art: stock             # stock: ordinary poster (episodes: Plex's image); skip: leave the item alone
overlay_marker: true           # Tag outputs so ImageMaid --overlays-only can clean up old uploads; see README

# Layout names are entirely yours; the script has no built-in named presets.
# Each layout below is fully independent: edit one without affecting the others.
default_layout: overlayrr-main   # Used when nothing more specific matches
layout_by_library:               # Plex library name -> layout
  Movies: tk-movies
  TV Shows: tk-tv
# layout_by_type:                # Optional: movie / tv / collection -> layout. "collection" beats layout_by_library,
#   collection: overlayrr-main   # so collections don't inherit their movie library's layout.

layouts:
  overlayrr-main:
    width: 2000
    height: 3000
    poster_zoom: 1
    poster_shift_y: -0.04
    # poster_shift_x: 0             # Moves the picture sideways (a fraction of the width), like poster_shift_y
    matte_height_ratio: 0.22
    fade_height_ratio: 0.21
    # fade_smoothness: 0            # 0 = straight ramp; 1 = eased at both ends, so no visible edge where the fade starts or meets the matte
    # matte_opacity: 1              # How solid the matte is (0-1); lower lets the poster show through
    # matte_color: "#000000"        # What the poster fades to
    vignette_strength: 0.03
    # vignette_mode: classic        # classic dims the whole picture evenly (as the parent app does); radial is a real vignette, darkest at the corners
    # vignette_color: "#000000"
    # vignette_size: 1              # radial: how far in it reaches (smaller darkens nearer the middle)
    # vignette_falloff: 2           # radial: 1 = straight ramp; higher stays clear longer, then darkens toward the edges
    grain_amount: 0.22
    # grain_mode: blend             # blend (as in Simposter) lifts blacks and dims whites toward grey; film adds visible grain that fades out toward black and white
    # grain_size: 1.5               # How coarse the noise is (pixels on a 2000px-wide poster)
    grain_seed: null
    uniform_logo_max_w: 1282
    uniform_logo_max_h: 352
    uniform_logo_offset_x: 0.5
    uniform_logo_offset_y: 0.83
    uniform_logo_h_align: center
    uniform_logo_v_align: center
    # uniform_logo_trim: false      # true trims the logo's transparent padding before fitting it, so every logo fills its box alike
    poster_filter: textless
    logo_preference: white
    logo_min_brightness: 60       # Skip black/very dark logos (0-255 average brightness); colored logos pass. 0 = keep any
    logo_mode: original
    border_enabled: false
    border_px: 0
    border_color: "#FFFFFF"
    text_overlay_enabled: false
    custom_text: ""
    font_file: null
    font_size: 120
    text_color: "#FFFFFF"
    text_transform: none
    letter_spacing: 0
    position_y: 0.5
    season_options:                # Season posters: only what differs from above
      logo_mode: none
      text_overlay_enabled: true
      custom_text: "{season}"
      font_size: 150
      letter_spacing: 1
      position_y: 0.85
      text_transform: uppercase
      # font_file: resources/fonts/Arial-Bold.ttf
      # position_x: 0.5              # Where the text is centered across the poster
      # text_line_spacing: 0.2       # Gap between lines, as a fraction of the font size
      # text_stroke_width: 6         # Outline (pixels on a 2000px-wide poster; 0 = none); also text_stroke_opacity and text_stroke_color
      # text_shadow_strength: 0.6    # Soft shadow (0 = none, 1 = solid); also text_shadow_blur, text_shadow_offset_y and text_shadow_color

  tk-movies:
    # badges: [gradients, resolution, edition, codec, audience_score]  # See README "Badges"; list gradient_top and/or gradient_bottom instead of gradients for one edge or separate settings
    # badge_gradient_top_height: 0.25      # Each edge's reach (fraction of the height) and blackness (0-1); unset, an edge uses
    # badge_gradient_top_strength: 0.67    # badge_gradient_height / badge_gradient_strength (0.25 / 0.67), which set both edges
    # badge_gradient_bottom_height: 0.25
    # badge_gradient_bottom_strength: 0.67
    # resolution_font_file: resources/fonts/Poppins/Poppins-ExtraBold.ttf  # Resolution, edition and status badges are drawn as text
    # edition_font_file: resources/fonts/Poppins/Poppins-Regular.ttf
    # resolution_font_size: 60   # Pixels on a 1000px-wide poster
    # edition_font_size: 58
    # badge_text_color: "#FFFFFF"
    # badge_stroke_width: 2          # Outline around the resolution, edition and status text (pixels on a 1000px-wide poster; 0 = none)
    # badge_stroke_opacity: 1        # 0 = none, 1 = solid
    # badge_stroke_color: "#000000"
    # badge_shadow_strength: 0.6     # Soft shadow behind that text (0 = none, 1 = solid)
    # badge_shadow_blur: 5           # How far it spreads (pixels on a 1000px-wide poster)
    # badge_shadow_offset_y: 0       # Shift it down this many pixels; 0 = centered on the text
    # badge_shadow_color: "#000000"
    # badge_layout: kometa           # flow lays the top-left badges out left to right, so the text sizes can grow
    # badge_margin: 25               # Distance from the poster's edges (pixels on a 1000px-wide poster)
    # badge_gap: 14                  # With flow: the space between the top-left badges
    # badge_fit: false               # true shrinks text that would run past the margins
    # badge_text_transform: uppercase   # none (as written), uppercase or lowercase
    # badge_art_scale: 1             # Size of the IMAX, codec and score art
    # badge_gradient_color: "#000000"
    # audience_score_text_color: "#111111"
    # audience_score_font_size: 68
    # audience_score_font_file: resources/fonts/centurygothic_bold.ttf
    # audience_score_tiers: [8.5, 7, 5.5, 3]   # The scores where the art becomes excellent, good, average and bad
    # resolution_labels: {4k: "4K"}  # Reword badges; also status_labels and edition_labels (names in the README)
    width: 2000
    height: 3000
    poster_zoom: 1
    poster_shift_y: -0.04
    matte_height_ratio: 0.22
    fade_height_ratio: 0.21
    vignette_strength: 0.03
    grain_amount: 0.12
    grain_seed: null
    uniform_logo_max_w: 1500
    uniform_logo_max_h: 500
    uniform_logo_offset_x: 0.5
    uniform_logo_offset_y: 0.83
    uniform_logo_h_align: center
    uniform_logo_v_align: center
    # uniform_logo_shadow_enabled: true   # Drop shadow behind the logo (Simposter's settings, plus spread); the rest apply when it is on
    # uniform_logo_shadow_color: "#000000"
    # uniform_logo_shadow_opacity: 60     # 0-100
    # uniform_logo_shadow_angle: -45      # Degrees the light comes from, counterclockwise from the right; the shadow falls the other way (-45 = up left, 135 = down right)
    # uniform_logo_shadow_distance: 8     # Pixels on a 2000px-wide poster
    # uniform_logo_shadow_size: 15        # Blur, same units
    # uniform_logo_shadow_spread: 0       # 0-100: grows the shape before the blur so thin logos still cast a shadow (20-50 reads well)
    poster_filter: textless
    logo_preference: any
    logo_min_brightness: 60       # Skip black/very dark logos (0-255 average brightness); colored logos pass. 0 = keep any
    logo_mode: original
    border_enabled: false
    border_px: 0
    border_color: "#FFFFFF"
    text_overlay_enabled: false
    custom_text: ""
    font_file: null
    font_size: 120
    text_color: "#FFFFFF"
    text_transform: none
    letter_spacing: 0
    position_y: 0.5
    season_options:                # Season posters: only what differs from above
      logo_mode: none
      text_overlay_enabled: true
      custom_text: "{season}"
      font_size: 150
      letter_spacing: 1
      position_y: 0.85
      text_transform: uppercase
      # font_file: resources/fonts/Arial-Bold.ttf

  tk-tv:
    # badges: [gradients, resolution, status, audience_score]          # See README "Badges"
    # status_banner_date_format: "dd/mmm"  # With the status_banner badge: 28/Oct for dates more than a week away
    # status_banner_simplify_dates: true   # Today, tomorrow or the full weekday for dates up to seven days ahead
    width: 2000
    height: 3000
    poster_zoom: 1
    poster_shift_y: -0.04
    matte_height_ratio: 0.22
    fade_height_ratio: 0.21
    vignette_strength: 0.03
    grain_amount: 0.12
    grain_seed: null
    uniform_logo_max_w: 1700
    uniform_logo_max_h: 600
    uniform_logo_offset_x: 0.5
    uniform_logo_offset_y: 0.86
    uniform_logo_h_align: center
    uniform_logo_v_align: center
    # uniform_logo_center_below: 350  # With v_align top, logos shorter than this (px) are centered in the matte band instead
    poster_filter: textless
    logo_preference: any
    logo_min_brightness: 60       # Skip black/very dark logos (0-255 average brightness); colored logos pass. 0 = keep any
    logo_mode: original
    border_enabled: false
    border_px: 0
    border_color: "#FFFFFF"
    text_overlay_enabled: false
    custom_text: ""
    font_file: null
    font_size: 120
    text_color: "#FFFFFF"
    text_transform: none
    letter_spacing: 0
    position_y: 0.5
    season_options:                # Season posters: only what differs from above
      uniform_logo_max_w: 1500
      uniform_logo_max_h: 500
      uniform_logo_offset_y: 0.83
      logo_mode: original
      text_overlay_enabled: true
      custom_text: "{season}"
      font_size: 150
      letter_spacing: 1
      position_y: 0.95
      text_transform: uppercase
      # font_file: resources/fonts/Barlow-Regular.ttf
    episode_options:               # Episode title cards (TitleCardMaker "TitleColorMatch" look); see README
      width: 3200
      height: 1800
      logo_mode: original
      uniform_logo_max_w: 1155     # Logo box in pixels on a 3200px-wide card, anchored top left
      uniform_logo_max_h: 650
      text_transform: uppercase    # Applies to the title and the season/episode text
      card_gradient: radial        # generated, dithered fade, or null for none
      gradient_center_x: 0.68      # Where the photo is clear (0 = left edge, 1 = right edge)
      gradient_center_y: 0.48
      gradient_radius_x: 0.465     # Fade size as a fraction of width/height
      gradient_radius_y: 0.6
      gradient_softness: 4         # Higher = flatter clear center and steeper edge; lower = longer, gentler fade
      gradient_strength: 1.0       # 0 to 1: how black the edges get
      gradient_corner_strength: 0.35  # Faint extra darkening that mostly touches the corners; 0 = off
      title_color: auto            # auto = the logo's dominant color; or "#RRGGBB"
      title_min_brightness: 80     # With auto: skip logo colors darker than this (0-255); 0 = any
      stroke_opacity: 0.9          # Dark outline around the title and season/episode text (0 = none, 1 = solid)
      title_stroke_width: 8        # Outline widths in pixels on a 3200px-wide card (the original card used 3 and 6)
      index_stroke_width: 12
      shadow_strength: 0.7         # Soft shadow behind the title and season/episode text (0 = none, 1 = solid black)
      shadow_blur: 24              # How far it spreads (pixels on a 3200px-wide card)
      shadow_offset_y: 0           # Shift it down this many pixels; 0 = centered on the text
      title_font_size: 157
      title_max_line_width: 32
      title_max_lines: 3
      index_font_size: 68
      index_color: "#CFCFCF"
      season_text: "SEASON {season_number}"   # "" hides the season label
      episode_text: "EPISODE {episode_number}"
      # The card's logo and text have their own placement settings (pixels on a 3200px-wide card); these are the defaults:
      # card_logo_offset_x: 0        # 0 = against the left margin, 1 = against the right one
      # card_logo_offset_y: 0        # 0 = against the top margin, 1 = against the bottom one
      # card_logo_h_align: left      # left, center or right, inside the logo's box
      # card_logo_v_align: top       # top, center or bottom
      # card_logo_trim: true         # trim the logo's transparent padding
      # card_logo_shadow_enabled: false   # a drop shadow behind the logo; see the README for its settings
      # title_letter_spacing: -1.25
      # title_line_spacing: -22      # negative is tighter
      # title_x: 50                  # the title's left edge
      # title_bottom: 125            # from the card's bottom edge to the title's last line
      # title_stroke_color: auto     # auto = black (white if the title color is very dark), or "#RRGGBB"
      # index_letter_spacing: 5.42
      # index_gap: 30                # between the season and the episode text
      # index_x: 50
      # index_bottom: 50
      # index_stroke_color: "#000000"
      # shadow_color: "#000000"      # of the title and season/episode shadow
      # Fonts are not bundled. Copy these from TitleCardMaker's backend/assets/standard:
      # title_font_file: resources/fonts/Sequel-Neue.otf
      # season_font_file: "resources/fonts/Proxima Nova Semibold.otf"
      # episode_font_file: "resources/fonts/Proxima Nova Regular.otf"

  # Collections as TMDb's own poster with its text: no logo, no effects, nothing from Fanart.tv.
  # Use it with:  layout_by_type: {collection: collection-tmdb}
  collection-tmdb:
    logo_mode: none
    poster_filter: text

  # Streaming service collections ("Netflix Shows"): the service's logo centered over a radial gradient in its color.
  # Use it with:  layout_by_type: {streaming: streaming-collection}
  streaming-collection:
    uniform_logo_max_w: 1400
    uniform_logo_max_h: 1000
    uniform_logo_offset_x: 0.5
    uniform_logo_offset_y: 0.5
    # streaming_colors: {Netflix: "#5a0a0f"}   # Override a service's color
    # collection_gradient_radius: 1.25         # How far the glow reaches
    # collection_gradient_strength: 0.55       # How much the edges darken
    # collection_gradient_corner: 0.4          # Extra darkening toward the bottom left
    #   (these apply when a poster is generated: delete its poster.png to make a new one)

  # "Newly Released" (movies) / "New Episodes" (TV): the Plex logo over an amber gradient, the name below on two lines.
  # Use it with:  layout_by_type: {chart: chart-collection}
  chart-collection:
    uniform_logo_max_w: 1100
    uniform_logo_max_h: 600
    uniform_logo_offset_x: 0.5
    uniform_logo_offset_y: 0.36
    text_overlay_enabled: true
    custom_text: "{title_lines}"     # {title_lines} puts each word of the collection's name on its own line
    text_transform: uppercase
    font_file: resources/fonts/Poppins/Poppins-Regular.ttf
    font_size: 230
    text_color: "#FFFFFF"
    position_y: 0.66
    # chart_color: "#8a5a10"        # The glow behind the chart posters (when a poster is generated)

# Optional layout fields: border_enabled, border_px, border_color, border_radius, grain_seed,
# text_color, font_file, and other settings listed in README.md.
# Use width: 1000 and height: 1500 for less pixel work; all sizes scale accordingly.

# To customize artwork, replace poster.jpg/png or logo.png in a title's assets
# folder, then run with --changed-only. Missing files are selected automatically.
# Seasons use Season 01/, Season 02/, etc.; Season 00 is Specials.
# A season always uses its show's logo (a logo file in the season folder is ignored).
# Episodes use Season 01/Episode 01/ (the still is saved there as poster.jpg and reused).
# Episodes always use the show's logo too.
# Keep just one poster and one logo per folder; remove the old extension if changing formats.
# Universe collections: Collections -> Discover -> Universes in the web interface.
# Or add a source-backed custom collection manually (use your exact Plex library name):
# collections:
#   - name: Marvel Cinematic Universe
#     library: Movies
#     type: movie              # Use tv in a separate definition for the TV library
#     enabled: false           # Enable after reviewing the plan
#     sync: append             # sync also removes members absent from the source
#     source:
#       url: https://www.imdb.com/list/ls539646485/
#       limit: 250
#       refresh: true          # Refresh the source on collection runs
# Preview: python overlayrr.py config.yaml --custom-collections plan
# MDBList universe presets require MDBLIST_API_KEY; IMDb can block public imports.

# Optional metadata/layout overrides for items discovered in Plex:
# overrides:
#   "12345":
#     tmdb_id: 603             # Optional correction for missing/incorrect Plex GUIDs
#     layout: tk-movies        # Optional layout for just this item

# Optional individual jobs (can also run without Plex: set libraries: []).
# items:
#   - type: movie
#     tmdb_id: 603
#     layout: tk-movies
#     output: rendered.png      # Optional filename inside this movie's assets folder
#   - type: tv
#     tvdb_id: 81189
#     season: 1                # Remove this field to render the series poster
#     layout: tk-tv
#   - type: tv
#     tmdb_id: 1396
#     season: 1
#     episode: 1               # Episode title card; the title is looked up unless you set episode_title
#     layout: tk-tv
#   - title: Custom Movie
#     poster: assets/my-poster.jpg
#     logo: assets/my-logo.png
#     output: custom.png
